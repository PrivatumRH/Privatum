[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
robinhood_mainnet = "${ROBINHOOD_RPC_URL:-https://rpc.robinhoodchain.com}"
robinhood_sepolia = "${ROBINHOOD_SEPOLIA_RPC_URL:-https://sepolia-rpc.robinhoodchain.com}"
localhost = "http://127.0.0.1:8545"

[etherscan]
robinhood_mainnet = { key = "${BLOCKSCOUT_API_KEY:-dummy}", url = "https://robinhoodchain.blockscout.com/api" }
